name: Build GD-RTC

on:
  # Builds are manual while multiplayer functionality is under active development.
  # This avoids spending CI minutes on every intermediate commit.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            runner: windows-latest
            target: Win64
          - name: Android64
            runner: ubuntu-latest
            target: Android64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: ${{ matrix.platform.target }}
          use-lto: false

      - name: Upload .geode package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gd-rtc-${{ matrix.platform.name }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
