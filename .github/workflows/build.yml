name: Build GD-RTC

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            runner: windows-latest
            target: Win64
          - name: macOS
            runner: macos-latest
            target: MacOS
          - name: iOS
            runner: macos-latest
            target: iOS
          - name: Android64
            runner: ubuntu-latest
            target: Android64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.11.2
          target: ${{ matrix.platform.target }}
          use-lto: false
          bindings: ${{ matrix.platform.target == 'iOS' && 'vwtfafa/bindings' || 'geode-sdk/bindings' }}
          bindings-ref: ${{ matrix.platform.target == 'iOS' && 'fix/2.2081-depends' || '' }}

      - name: Upload .geode package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gd-rtc-${{ matrix.platform.name }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
